<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lab Evoala"><meta name="theme-color" content="#6C4FE0">
<title>Escucha y repite · Laboratorio Evoala</title>
<link rel="stylesheet" href="../lab.css">
<style>
  .wrap{padding-bottom:200px}
  .q{text-align:center;padding:4px 0 0}
  .esc{display:inline-flex;align-items:center;gap:12px;padding:10px 26px 10px 12px;border-radius:16px;background:var(--lav);color:var(--violet-dark);font-weight:600;font-size:18px;margin:6px auto 18px;transition:transform .1s}
  .esc:active{transform:scale(.97)}
  .esc .c{width:44px;height:44px;border-radius:50%;background:#C4BAF4;display:grid;place-items:center}
  .esc .c svg{width:22px;height:22px;fill:#4A33B0}
  .esc.on .c{animation:pulse 1s infinite}
  .q .ic{margin:0 auto 14px}
  .q h2{margin:0;font-size:30px;font-weight:700}
  .q .es{margin-top:4px;font-size:18px;color:var(--gray)}
  .bas{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:22px;min-height:120px}
  /* Micro : un gros bouton rond qui change d'état (prêt → un moment → parle → je t'écoute) */
  .micbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;animation:monte .35s ease-out}
  .rond{position:relative;isolation:isolate;width:88px;height:88px;border-radius:50%;background:var(--violet);display:grid;place-items:center;box-shadow:0 5px 0 var(--violet-dark);transition:background .2s,transform .1s}
  .rond:active{transform:translateY(3px);box-shadow:0 2px 0 var(--violet-dark)}
  .rond svg{width:38px;height:38px;fill:#fff}
  .rond .barres{display:none;gap:5px;align-items:center;height:38px}
  .rond .barres i{display:block;width:6px;height:10px;border-radius:3px;background:#fff}
  .etat{font-size:17px;font-weight:600;color:var(--violet-dark);min-height:24px;text-align:center}
  .etat small{display:block;font-size:13px;font-weight:500;color:var(--gray)}
  .bulle{max-width:92%;min-height:44px;font-size:16px;color:var(--ink);border-radius:14px;padding:10px 14px;line-height:1.5}   /* place réservée : rien ne bouge quand le texte arrive */
  .bulle:not(:empty){background:#fff;box-shadow:0 2px 10px rgba(60,40,140,.08)}
  .micbox[data-etat="prep"] .rond{background:#B8AEF0;box-shadow:0 5px 0 #9C90E3}
  .micbox[data-etat="prep"] .rond::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:var(--violet);animation:tourne .8s linear infinite}
  .micbox[data-etat="ecoute"] .rond,.micbox[data-etat="voix"] .rond{background:#E5484D;box-shadow:0 5px 0 #B8323A}
  .micbox[data-etat="ecoute"] .rond::before,.micbox[data-etat="voix"] .rond::before{content:"";position:absolute;inset:0;border-radius:50%;background:#E5484D;animation:onde 1.4s ease-out infinite;z-index:-1}
  .micbox[data-etat="ecoute"] .rond svg,.micbox[data-etat="voix"] .rond svg{display:none}
  .micbox[data-etat="ecoute"] .rond .barres,.micbox[data-etat="voix"] .rond .barres{display:flex}
  .micbox[data-etat="ecoute"] .barres i{animation:barre 1.2s ease-in-out infinite}
  .micbox[data-etat="voix"] .barres i{animation:barre .45s ease-in-out infinite}
  .barres i:nth-child(2){animation-delay:.15s!important}.barres i:nth-child(3){animation-delay:.3s!important}.barres i:nth-child(4){animation-delay:.45s!important}
  .micbox[data-etat="ecoute"] .etat,.micbox[data-etat="voix"] .etat{color:#C4313A}
  .diag{font:11px/1.4 ui-monospace,Menlo,monospace;color:#B3AEC4;text-align:center;min-height:15px}
  @keyframes onde{from{transform:scale(1);opacity:.45}to{transform:scale(1.7);opacity:0}}
  @keyframes barre{0%,100%{height:8px}50%{height:34px}}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .lien{font-size:14px;font-weight:600;color:#B3AEC4}
  /* panneau de résultat, en bas comme dans l'appli */
  .sheet{position:fixed;left:0;right:0;bottom:0;padding:22px 20px max(22px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;text-align:center;transform:translateY(110%);transition:transform .3s ease-out;z-index:5}
  .sheet.on{transform:none}
  .sheet .in{max-width:720px;margin:0 auto}
  .sheet .tt{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .sheet .tt img{width:52px;margin-top:-34px}
  .sheet h3{margin:0;font-size:24px;font-weight:700}
  .sheet p{margin:0 0 14px;font-size:15px;min-height:4px;white-space:pre-line;line-height:1.5}
  .sheet .okb{margin-top:6px}
  .sheet.bien{background:#D3EFB8}.sheet.bien h3{color:#3E8E1F}.sheet.bien .okb{background:#7BC94A;box-shadow:0 4px 0 #5DA532}
  .sheet.presque{background:#FFE7C2}.sheet.presque h3{color:#A8620A}.sheet.presque .okb{background:#E8962E;box-shadow:0 4px 0 #C27716}
  .sheet .alt[hidden]{display:none}
  .sheet .alt{display:block;width:100%;margin-top:12px;font-weight:600;color:#8A7F6A;font-size:14px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,79,224,.35)}50%{box-shadow:0 0 0 12px rgba(108,79,224,0)}}
  @keyframes monte{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">‹</a><div class="prog" style="flex:1;margin:0"><i id="bar"></i></div><a class="tag" href="../grille.html?act=Escucha%20y%20repite" style="text-decoration:none">📋</a></div>
  <div class="card row" style="margin-bottom:10px"><select id="theme"></select></div>
  <div id="zone"></div>
</div>
<div class="sheet" id="sheet"><div class="in"><div class="tt"><img id="sh-evo" src="/img/ui/evo-happy.png" alt=""><h3 id="sh-t"></h3></div><p id="sh-p"></p><button class="okb" id="sh-ok">Continuar</button><button class="alt" id="sh-alt" hidden>Continuar sin repetir</button></div></div>
<script src="../lab.js"></script>
<script>
// Escucha y repite (étape Découverte) : un mot ou une phrase, avec son illustration et sa traduction.
// 1. On écoute (« Escucha »)  2. le bouton « Repite » apparaît, on répète au micro  3. « ¡Excelente! » et on continue.
// Validation mot par mot : tous les mots doivent être dits (les mots longs peuvent être approximatifs). Après 2 essais, on passe quand même.
const N = 8; let theme = "", list = [], k = 0, essais = 0, rec = null;
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>';

function start(){
  const ok = p => p.es && p.audio && p.icon && !/…|\.\.\./.test(p.fr);   // pas de phrases à trous (« Ça vous fait … euros »)
  let pool = Lab.phrases(theme).filter(ok);
  if(pool.length < 3) pool = Lab.phrases("").filter(ok);
  list = pool.slice(0, N); k = 0; ask();
}

function ask(){
  fermer(); arreter(); essais = 0;
  $("bar").style.width = (k / list.length * 100) + "%";
  if(k >= list.length){
    $("zone").innerHTML = `<div class="card end"><img src="/img/ui/evo.png" alt=""><h2>¡Muy bien!</h2><p class="muted">Descubriste ${list.length} palabras y frases nuevas.</p><button class="btn" onclick="start()">Otra vez</button></div>`;
    return;
  }
  const p = list[k];
  $("zone").innerHTML = `<div class="q">
      <button class="esc" id="esc"><span class="c">${Lab.SPK}</span>Escucha</button>
      ${Lab.icon(p, 150)}<h2>${p.fr}</h2><div class="es">${p.es}</div>
      <div class="bas" id="bas"><button class="lien" id="noesc">No puedo escuchar</button></div></div>`;
  $("esc").onclick = () => ecouter(p);
  $("noesc").onclick = montrerMic;
  ecouter(p);
}

// 1. Écouter : le bouton « Repite » apparaît quand l'audio est fini (ou tout de suite s'il ne peut pas être joué)
async function ecouter(p){
  const b = $("esc"); b.classList.add("on");
  await Lab.playToEnd(p);
  if($("esc") === b){ b.classList.remove("on"); montrerMic(); }
}

function montrerMic(){
  if($("mic")) return;
  $("bas").innerHTML = `<div class="micbox" id="micbox" data-etat="pret"><div class="bulle" id="bulle"></div>
      <button class="rond" id="mic" aria-label="Hablar">${MIC}<span class="barres"><i></i><i></i><i></i><i></i></span></button>
      <div class="etat" id="etat"></div></div>
    <button class="lien" id="noparle">No puedo hablar</button><div class="diag" id="diag"></div>`;
  etat("pret");
  $("mic").onclick = repeter;
  $("noparle").onclick = () => { arreter(); ouvrir("bien", "¡Sigamos!", "Puedes repetir en voz baja, también cuenta."); };
}

// États visibles du micro
const ETATS = {
  pret:   "Toca y repite",
  prep:   "Un momento…",
  ecoute: "¡Habla ahora!<small>Toca para terminar</small>",
  voix:   "Te escucho…<small>Toca para terminar</small>",
  fin:    "Un momento…"
};
function etat(e, msg){
  const box = $("micbox"); if(!box) return;
  box.dataset.etat = e; $("etat").innerHTML = msg || ETATS[e];
}
// Journal discret des événements du micro (labo uniquement), pour comprendre un blocage sur un téléphone
let journal = [];
function diag(m){ journal.push(m); const d = $("diag"); if(d) d.textContent = "🎤 " + journal.join(" · "); }

// 2. Répéter au micro
// Le micro de l'iPhone met près d'une seconde à s'ouvrir : on affiche « Un momento… », puis « ¡Habla ahora! » en rouge
// quand il écoute vraiment. On s'arrête dès que toute la phrase est reconnue, après 1,3 s de silence, après 8 s,
// ou quand l'apprenant touche de nouveau le bouton.
let entendu = "", alts = [], fini = false, tSilence = null, tMax = null, tPrep = null, debut = 0, voix = false, relance = 0;
function repeter(){
  const p = list[k];
  if(rec){ diag("stop"); terminer(); return; }     // 2e appui : on arrête et on évalue ce qui a été dit
  if(!SR){ // navigateur sans reconnaissance vocale : pas de correction possible
    Lab.toast("Sin reconocimiento de voz en este navegador");
    return ouvrir("bien", "¡Excelente!", "« " + p.fr + " »");
  }
  Lab.stop();                                       // l'audio du guide ne doit pas se mélanger au micro
  entendu = ""; alts = []; fini = false; voix = false; relance = 0; journal = []; $("bulle").textContent = "";
  lancer();
}
function lancer(){
  rec = new SR(); rec.lang = "fr-FR"; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 3;
  debut = Date.now(); etat("prep"); diag(relance ? "relance" : "start");
  const ecoute = () => { clearTimeout(tPrep); if(!fini && !voix) etat("ecoute"); };
  rec.onstart = () => diag("ok");
  rec.onaudiostart = () => { diag("audio"); ecoute(); };
  tPrep = setTimeout(ecoute, 1200);                 // certains navigateurs ne signalent pas l'ouverture du micro
  rec.onspeechstart = () => { diag("voz"); voix = true; etat("voix"); };
  rec.onresult = e => {
    if(!voix){ voix = true; etat("voix"); }
    // texte entendu jusqu'ici (meilleure version de chaque morceau) + variantes du dernier morceau
    entendu = [...e.results].map(r => r[0].transcript).join(" ").replace(/\s+/g, " ").trim();
    const der = e.results[e.results.length - 1], avant = [...e.results].slice(0, -1).map(r => r[0].transcript).join(" ");
    alts = [...der].map(x => (avant + " " + x.transcript).trim());
    $("bulle").textContent = entendu;
    if(meilleur().ok){ diag("frase completa"); return terminer(); }   // phrase complète : on n'attend pas
    clearTimeout(tSilence); tSilence = setTimeout(() => { diag("silencio"); terminer(); }, 1300);
  };
  rec.onerror = e => {
    diag("error: " + e.error);
    if(e.error === "no-speech" || e.error === "aborted") return;
    fini = true; arreter();
    if(e.error === "not-allowed" || e.error === "service-not-allowed") etat("pret", "Permite el micrófono y el dictado<small>Ajustes › General › Teclado › Dictado</small>");
    else etat("pret", "El micrófono no respondió<small>Toca para intentar otra vez</small>");
  };
  rec.onend = () => {
    diag("fin");
    if(fini) return;
    // l'iPhone ferme parfois le micro aussitôt ouvert, sans rien entendre : on le relance une fois
    if(!entendu && !voix && Date.now() - debut < 1500 && relance < 1){ relance++; rec = null; try{ return lancer(); }catch(e){} }
    terminer();
  };
  clearTimeout(tMax); tMax = setTimeout(() => { diag("8 s"); terminer(); }, 8000);
  try{ rec.start(); }catch(e){ diag("start falló"); fini = true; arreter(); etat("pret", "El micrófono no respondió<small>Toca para intentar otra vez</small>"); }
}
// Évaluation mot par mot : chaque mot de la phrase doit avoir été dit, dans l'ordre.
// Un mot long peut être approximatif (prononciation), un mot court doit être exact (« pas », « ne », « le »… changent le sens).
const HOMO = [["et","est","ai","es","e"],["a","as","ah"],["ou"],["la","las"],["son","sont"],["on","ont"],["mes","mais","mai","met","mets"],["ce","se"],["cest","ces","ses","sest","sait","sais"],["vert","verre","vers","ver"],["un","hein"]];
function memeMot(cible, dit){
  if(cible === dit) return true;
  if(HOMO.some(g => g.includes(cible) && g.includes(dit))) return true;
  return cible.length >= 4 && ressemblance(cible, dit) >= 0.75;   // « bonjour » ≠ « bonsoir »
}
function evaluer(texte){
  const cible = norm(list[k].fr).split(" ").filter(Boolean), dit = norm(texte).split(" ").filter(Boolean);
  let j = 0; const manque = [];
  // un mot élidé (« dorange » pour « d'orange ») peut avoir été entendu en deux morceaux (« d orange »)
  cible.forEach(m => {
    let t = dit.findIndex((d, i) => i >= j && memeMot(m, d)), pas = 1;
    if(t < 0){ t = dit.findIndex((d, i) => i >= j && i + 1 < dit.length && memeMot(m, d + dit[i + 1])); pas = 2; }
    if(t < 0) manque.push(m); else j = t + pas;
  });
  return { manque, ok: !manque.length && dit.length > 0 };
}
function meilleur(){
  const cands = [entendu, ...alts].filter(Boolean);
  if(!cands.length) return { ok: false, dit: "", manque: [] };
  const ev = cands.map(t => ({ dit: t, ...evaluer(t) }));
  return ev.sort((x, y) => x.manque.length - y.manque.length)[0];
}
function terminer(){
  if(fini) return; fini = true;
  const p = list[k], { ok, dit, manque } = meilleur();
  arreter(); $("bulle") && ($("bulle").textContent = "");
  if(!dit){ etat("pret", "No te oí<small>Toca, espera « ¡Habla ahora! » y repite</small>"); return; }
  if(ok) return ouvrir("bien", "¡Excelente!", "Dijiste: « " + dit + " »");
  // mots manquants affichés comme dans la phrase (« pas », « c'est »…)
  const motsFr = list[k].fr.replace(/[?!.,¿¡…]/g, "").split(/[\s-]+/).filter(Boolean);
  const falta = "Te faltó: « " + manque.map(m => motsFr.find(w => norm(w) === m) || m).join(" ") + " »";
  essais++;
  if(essais >= 2) return ouvrir("bien", "¡Bien intentado!", "Dijiste: « " + dit + " »\nSe dice: « " + p.fr + " »", true);
  ouvrir("presque", "¡Casi!", "Dijiste: « " + dit + " »\n" + falta, false, true);
}
function arreter(){
  clearTimeout(tSilence); clearTimeout(tMax); clearTimeout(tPrep);
  if(rec){ const r = rec; rec = null; try{ r.onend = null; r.onresult = null; r.abort(); }catch(e){} }
  etat("pret");
}

// Ressemblance entre ce qui a été entendu et la phrase (0 à 1), sans accents ni ponctuation
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/['’]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
function ressemblance(a, b){
  a = norm(a); b = norm(b); if(!a || !b) return 0; if(a === b) return 1;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - d[a.length][b.length] / Math.max(a.length, b.length);
}

// 3. Panneau du bas
function ouvrir(type, titre, texte, rejouer, reessayer){
  $("sh-evo").src = type === "bien" ? "/img/ui/evo-happy.png" : "/img/ui/evo.png";
  $("sheet").className = "sheet " + type + " on";
  $("sh-t").textContent = titre; $("sh-p").textContent = texte;
  $("sh-alt").hidden = !reessayer;
  $("sh-ok").textContent = reessayer ? "Intentar otra vez" : "Continuar";
  $("sh-ok").onclick = reessayer ? () => { fermer(); ecouter(list[k]); } : () => { k++; ask(); };
  if(rejouer) Lab.play(list[k]);
}
function fermer(){ $("sheet").className = "sheet"; }
$("sh-alt").onclick = () => { k++; ask(); };

// Premier écran : un seul toucher pour commencer (il débloque l'audio sur iPhone), ensuite chaque mot se lance seul
function accueil(){
  $("zone").innerHTML = `<div class="card end"><img src="/img/ui/evo.png" alt=""><h2>Escucha y repite</h2>
    <p class="muted">Escucha cada palabra y repítela en voz alta.</p><button class="btn" id="go">Empezar</button></div>`;
  $("go").onclick = start;
}
Lab.load().then(() => { Lab.themeSelect($("theme"), v => { theme = v; Lab.unlocked() ? start() : accueil(); }); accueil(); });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lab Evoala"><meta name="theme-color" content="#6C4FE0">
<title>¿Qué oyes? · Laboratorio Evoala</title>
<link rel="stylesheet" href="../lab.css">
<style>
  .wrap{padding-bottom:200px}
  .titre{font-size:22px;font-weight:600;color:var(--violet);margin:6px 0 14px}
  .gros{display:block;width:124px;height:124px;margin:10px auto 34px;border-radius:50%;background:#C4BAF4;box-shadow:0 6px 0 #A99BE4;display:grid;place-items:center;transition:transform .1s}
  .gros:active{transform:translateY(4px);box-shadow:0 2px 0 #A99BE4}
  .gros svg{width:56px;height:56px;fill:#4A33B0}
  .trad{margin:-18px 0 26px;text-align:center;font-size:18px;color:var(--gray)}
  .gros.on{animation:pulse 1s infinite}
  .choix{display:grid;gap:12px}
  .opt{display:flex;align-items:center;justify-content:center;min-height:64px;padding:14px 16px;font-size:19px !important;font-weight:600;border-radius:18px;background:#fff;border:2px solid #ECE9F4;box-shadow:0 3px 0 #ECE9F4;font-size:15px;line-height:1.3;text-align:center;transition:transform .08s}
  .opt:active{transform:translateY(2px);box-shadow:0 1px 0 #ECE9F4}
  .opt.sel{border-color:var(--violet);background:#F4F1FF;box-shadow:0 3px 0 #C9BEF6}
  .opt.ok{border-color:#3DBE7E;background:#E6F6EE;box-shadow:0 3px 0 #BDE8D0}
  .opt.no{border-color:var(--red);background:#FDECEF;box-shadow:0 3px 0 #F6C7D1}
  /* panneau de résultat (comme les autres activités) */
  .sheet{position:fixed;left:0;right:0;bottom:0;padding:22px 20px max(22px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;text-align:center;transform:translateY(110%);transition:transform .3s ease-out;z-index:5}
  .sheet.on{transform:none}
  .sheet .in{max-width:720px;margin:0 auto}
  .sheet .tt{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .sheet .tt img{width:52px;margin-top:-34px}
  .sheet h3{margin:0;font-size:24px;font-weight:700}
  .sheet p{margin:0 0 14px;font-size:16px;line-height:1.6}
  .sheet .okb{margin-top:6px}
  .sheet.bien{background:#D3EFB8}.sheet.bien h3{color:#3E8E1F}.sheet.bien .okb{background:#7BC94A;box-shadow:0 4px 0 #5DA532}
  .sheet.presque{background:#FFE7C2}.sheet.presque h3{color:#A8620A}.sheet.presque .okb{background:#E8962E;box-shadow:0 4px 0 #C27716}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,79,224,.35)}50%{box-shadow:0 0 0 10px rgba(108,79,224,0)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">‹</a><div class="prog" style="flex:1;margin:0"><i id="bar"></i></div><a class="tag" href="../grille.html?act=%C2%BFQu%C3%A9%20oyes%3F" style="text-decoration:none">📋</a></div>
  <div class="card row" style="margin-bottom:10px"><select id="theme"></select></div>
  <div id="zone"></div>
</div>
<div class="sheet" id="sheet"><div class="in"><div class="tt"><img id="sh-evo" src="/img/ui/evo-happy.png" alt=""><h3 id="sh-t"></h3></div><p id="sh-p"></p><button class="okb" id="sh-ok">Continuar</button></div></div>
<script src="../lab.js"></script>
<script>
// ¿Qué oyes? (étape Compréhension) : on entend une phrase en français (sans la voir), on choisit
// parmi 2 phrases écrites celle qu'on a entendue, puis « Comprobar ». Pas d'image : on relie le son à l'écrit.
// L'autre phrase vient du même thème et lui ressemble (longueur, mots en commun), pour qu'il faille vraiment écouter.
// Variante Découverte (?trad=1) : une ligne sous le haut-parleur montre la traduction de la phrase entendue
const TRAD = new URLSearchParams(location.search).has("trad");
const TITRE = TRAD ? "¿Qué oyes? (con traducción)" : "¿Qué oyes?";
document.title = TITRE + " · Laboratorio Evoala";
document.querySelector('.top .tag').href = "../grille.html?act=" + encodeURIComponent(TITRE);
const N = 8; let demarre = false, theme = "", list = [], k = 0, score = 0, opts = [], choix = null, verifie = false;
const $ = id => document.getElementById(id);
const ok = p => p.fr && p.es && p.audio && !/…|\.\.\./.test(p.fr);

// L'autre phrase : parmi celles du même thème, la plus proche de la bonne (longueur, mots en commun),
// pour qu'on ne puisse pas répondre sans écouter (« Le bus » contre « Quelle ligne je dois prendre ? » se devine)
const motsDe = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean);
function procheDe(p){
  const cands = Lab.voisins(p, 15, x => ok(x) && x.fr.toLowerCase() !== p.fr.toLowerCase());
  const mp = motsDe(p.fr);
  const note = x => { const mx = motsDe(x.fr), communs = mx.filter(w => mp.includes(w)).length;
    return communs * 3 - Math.abs(mx.length - mp.length) * 2 - Math.abs(x.fr.length - p.fr.length) / 6; };
  return cands.sort((a, b) => note(b) - note(a))[0];
}
function start(){
  demarre = true;
  let pool = Lab.phrases(theme).filter(ok);
  if(pool.length < 2) pool = Lab.phrases("").filter(ok);
  list = pool.slice(0, N); k = 0; score = 0; ask();
}
function ask(){
  fermer(); choix = null; verifie = false;
  $("bar").style.width = (k / list.length * 100) + "%";
  if(k >= list.length){
    $("zone").innerHTML = `<div class="card end"><img src="/img/ui/evo.png" alt=""><h2>${score} / ${list.length}</h2><p class="muted">${score === list.length ? "¡Perfecto!" : "¡Sigue practicando!"}</p><button class="btn" onclick="start()">Otra vez</button></div>`;
    return;
  }
  const p = list[k];
  const autre = [procheDe(p)].filter(Boolean);
  opts = Lab.shuffle([p, ...autre]);
  $("zone").innerHTML = `<div class="titre">¿Qué oyes?</div>
    <button class="gros" id="spk" aria-label="Escuchar otra vez">${Lab.SPK}</button>
    ${TRAD ? `<div class="trad">${p.es}</div>` : ""}
    <div class="choix">${opts.map((o, i) => `<button class="opt" data-i="${i}">${o.fr}</button>`).join("")}</div>
    <button class="okb" id="ok" disabled>Comprobar</button>`;
  $("spk").onclick = ecouter;
  $("zone").querySelector(".choix").onclick = e => {
    const b = e.target.closest(".opt"); if(!b || verifie) return;
    choix = +b.dataset.i;
    document.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
    $("ok").disabled = false;
  };
  $("ok").onclick = verifier;
  ecouter();
}
async function ecouter(){
  const b = $("spk"); if(!b) return; b.classList.add("on");
  await Lab.playToEnd(list[k]); b.classList.remove("on");
}
function verifier(){
  if(choix === null || verifie) return; verifie = true;
  const p = list[k], bon = opts.indexOf(p), juste = choix === bon, cartes = document.querySelectorAll(".opt");
  cartes[choix].classList.remove("sel"); cartes[bon].classList.add("ok"); if(!juste) cartes[choix].classList.add("no");
  if(juste){ score++; ouvrir("bien", "¡Excelente!", `« ${p.fr} »<br>${p.es}`); }
  else ouvrir("presque", "¡Casi!", `Oíste: « <b>${p.fr}</b> »<br>${p.es}`);
}
function ouvrir(type, titre, html){
  $("sh-evo").src = type === "bien" ? "/img/ui/evo-happy.png" : "/img/ui/evo.png";
  $("sheet").className = "sheet " + type + " on";
  $("sh-t").textContent = titre; $("sh-p").innerHTML = html;
  $("sh-ok").onclick = () => { k++; ask(); };
}
function fermer(){ $("sheet").className = "sheet"; }

// Premier écran : un toucher pour commencer (débloque l'audio sur iPhone)
function accueil(){
  $("zone").innerHTML = `<div class="card end"><img src="/img/ui/evo.png" alt=""><h2>${TITRE}</h2>
    <p class="muted">Escucha la frase${TRAD ? ", mira lo que quiere decir" : ""} y elige la que oíste.</p><button class="btn" id="go">Empezar</button></div>`;
  $("go").onclick = start;
}
Lab.load().then(() => { Lab.themeSelect($("theme"), v => { theme = v; (demarre || Lab.unlocked()) ? start() : accueil(); }); accueil(); });
</script>
</body>
</html>

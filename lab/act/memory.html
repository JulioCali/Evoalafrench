<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lab Evoala"><meta name="theme-color" content="#6C4FE0">
<title>Memory · Laboratorio Evoala</title>
<link rel="stylesheet" href="../lab.css">
<style>
  .bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
  @media(min-width:560px){.board{grid-template-columns:repeat(4,1fr)}}
  .m{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .4s}
  .m.open,.m.done{transform:rotateY(180deg)}
  .m>div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center}
  .m .back{background:linear-gradient(145deg,#7E64E6,#5940BF);color:#fff;font-size:28px;box-shadow:0 3px 0 #4A33B0}
  .m .face{background:#fff;transform:rotateY(180deg);box-shadow:0 2px 10px rgba(60,40,140,.1);font-size:15px;line-height:1.25}
  .m .face.fr{font-weight:600;color:var(--violet-dark)}
  .m .face.es{font-style:italic;color:#4E4760}
  .m.done .face{background:#E6F6EE;box-shadow:0 0 0 2px #3DBE7E inset}
  .m.bad .face{animation:sh .35s}
  @keyframes sh{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
  .end{text-align:center;padding:30px 10px}
  .end img{width:90px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">‹</a><h1>Memory</h1><span class="tag">Prototipo</span></div>
  <div class="card row"><select id="theme"></select>
    <select id="size"><option value="4">4 parejas</option><option value="6" selected>6 parejas</option><option value="8">8 parejas</option></select>
    <button class="btn" id="go">Nueva partida</button></div>
  <div class="bar"><span class="muted" id="info"></span><span class="muted" id="moves"></span></div>
  <div class="board" id="board"></div>
</div>
<script src="../lab.js"></script>
<script>
// Memory : chaque phrase donne deux cartes (français avec son illustration, et sa traduction).
// Retourner la carte française joue l'audio. Une paire trouvée reste ouverte en vert.
let theme = "", open = [], moves = 0, found = 0, total = 0, lock = false;
const $ = id => document.getElementById(id);
function start(){
  const n = +$("size").value, ph = Lab.phrases(theme, n).filter(p => p.es);
  total = ph.length; found = 0; moves = 0; open = [];
  const cards = Lab.shuffle(ph.flatMap((p, i) => [{ i, side: "fr", p }, { i, side: "es", p }]));
  $("board").innerHTML = cards.map((c, k) => `<button class="m" data-k="${k}" data-i="${c.i}" data-side="${c.side}"><div class="back">?</div>
    <div class="face ${c.side}">${c.side === "fr" ? Lab.icon(c.p, 48) + c.p.fr : c.p.es}</div></button>`).join("");
  $("board")._cards = cards; info();
}
function info(){ $("info").textContent = `${found} / ${total} parejas`; $("moves").textContent = `${moves} intentos`; }
$("board").onclick = e => {
  const b = e.target.closest(".m"); if(!b || lock || b.classList.contains("open") || b.classList.contains("done")) return;
  b.classList.add("open"); open.push(b);
  const c = $("board")._cards[b.dataset.k]; if(c.side === "fr") Lab.play(c.p);
  if(open.length < 2) return;
  moves++; const [a, d] = open;
  if(a.dataset.i === d.dataset.i && a.dataset.side !== d.dataset.side){
    setTimeout(() => { a.classList.add("done"); d.classList.add("done"); a.classList.remove("open"); d.classList.remove("open"); }, 350);
    open = []; found++; info();
    if(found === total) setTimeout(() => { $("board").innerHTML = `<div class="card end" style="grid-column:1/-1"><img src="/img/ui/evo.png" alt=""><h2>¡Muy bien!</h2><p class="muted">${total} parejas en ${moves} intentos.</p><button class="btn" onclick="start()">Otra partida</button></div>`; }, 900);
  } else {
    lock = true; info();
    setTimeout(() => { a.classList.add("bad"); d.classList.add("bad"); }, 400);
    setTimeout(() => { a.classList.remove("open", "bad"); d.classList.remove("open", "bad"); open = []; lock = false; }, 1100);
  }
};
$("go").onclick = start;
Lab.load().then(() => { Lab.themeSelect($("theme"), v => { theme = v; start(); }); start(); });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lab Evoala"><meta name="theme-color" content="#6C4FE0">
<title>Memory · Laboratorio Evoala</title>
<link rel="stylesheet" href="../lab.css">
<style>
  .bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
  @media(min-width:560px){.board{grid-template-columns:repeat(4,1fr)}}
  .m{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .4s}
  .m.open,.m.done{transform:rotateY(180deg)}
  .m>div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center}
  .m .back{background:linear-gradient(145deg,#7E64E6,#5940BF);color:#fff;font-size:28px;box-shadow:0 3px 0 #4A33B0}
  .m .face{background:#fff;transform:rotateY(180deg);box-shadow:0 2px 10px rgba(60,40,140,.1);font-size:15px;line-height:1.25}
  .m .face.fr{font-weight:600;color:var(--violet-dark)}
  .m .face.es{font-style:italic;color:#4E4760}
  .m.done .face{background:#E6F6EE;box-shadow:0 0 0 2px #3DBE7E inset}
  .m.bad .face{animation:sh .35s}
  @keyframes sh{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
  .end{text-align:center;padding:30px 10px}
  /* deux zones : une carte française se retourne avec une carte espagnole */
  .zone{margin:6px 0 16px}
  .zone h3{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gray);display:flex;align-items:center;gap:8px}
  .zone h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .zone.fr h3 i{background:var(--violet)} .zone.es h3 i{background:#F5A623}
  .zone.es .m .back{background:linear-gradient(145deg,#F7B955,#E8902B);box-shadow:0 3px 0 #C97418}
  /* phase de mémorisation */
  .memo{position:sticky;top:8px;z-index:5;margin:0 auto 10px;width:fit-content;background:#1C1F2B;color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;display:none}
  .memo.on{display:block}
  .end img{width:90px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">‹</a><h1>Memory</h1><span class="tag">Prototipo</span></div>
  <div class="card row"><select id="theme"></select>
    <select id="size"><option value="4">4 parejas</option><option value="6" selected>6 parejas</option><option value="8">8 parejas</option></select>
    <select id="secs"><option value="3">Memorizar 3 s</option><option value="5" selected>Memorizar 5 s</option><option value="8">Memorizar 8 s</option></select>
    <button class="btn" id="go">Nueva partida</button></div>
  <div class="bar"><span class="muted" id="info"></span><span class="muted" id="moves"></span></div>
  <div class="memo" id="memo"></div>
  <div id="board"></div>
</div>
<script src="../lab.js"></script>
<script>
// Memory : les cartes françaises en haut (avec l'illustration), les traductions en bas.
// Au début, toutes les cartes sont visibles quelques secondes pour les mémoriser, puis elles se retournent.
// On retourne une carte française et une carte espagnole : la carte française joue l'audio.
let theme = "", pick = { fr: null, es: null }, moves = 0, found = 0, total = 0, lock = true, timer = null;
const $ = id => document.getElementById(id);
const cardHTML = (c, k) => `<button class="m open" data-k="${k}" data-i="${c.i}" data-side="${c.side}"><div class="back">?</div>
  <div class="face ${c.side}">${c.side === "fr" ? Lab.icon(c.p, 48) + c.p.fr : c.p.es}</div></button>`;
function start(){
  clearInterval(timer);
  const n = +$("size").value, ph = Lab.phrases(theme).filter(p => p.es && p.es.trim().toLowerCase() !== p.fr.trim().toLowerCase()).slice(0, n);   // sans les phrases identiques dans les deux langues (« Un matcha »)
  total = ph.length; found = 0; moves = 0; pick = { fr: null, es: null }; lock = true;
  const fr = Lab.shuffle(ph.map((p, i) => ({ i, side: "fr", p }))), es = Lab.shuffle(ph.map((p, i) => ({ i, side: "es", p })));
  $("board")._cards = [...fr, ...es];
  $("board").innerHTML = `<div class="zone fr"><h3><i></i>Francés</h3><div class="board">${fr.map((c, k) => cardHTML(c, k)).join("")}</div></div>
    <div class="zone es"><h3><i></i>Español</h3><div class="board">${es.map((c, k) => cardHTML(c, k + fr.length)).join("")}</div></div>`;
  info();
  // mémorisation : compte à rebours, puis toutes les cartes se retournent
  let left = +$("secs").value; const memo = $("memo");
  memo.classList.add("on"); memo.textContent = `Memoriza las cartas… ${left}`;
  timer = setInterval(() => {
    left--;
    if(left > 0){ memo.textContent = `Memoriza las cartas… ${left}`; return; }
    clearInterval(timer); memo.textContent = "¡A jugar!";
    $("board").querySelectorAll(".m").forEach(m => m.classList.remove("open"));
    setTimeout(() => memo.classList.remove("on"), 900); lock = false;
  }, 1000);
}
function info(){ $("info").textContent = `${found} / ${total} parejas`; $("moves").textContent = `${moves} intentos`; }
$("board").onclick = e => {
  const b = e.target.closest(".m"); if(!b || lock || b.classList.contains("done")) return;
  const side = b.dataset.side, c = $("board")._cards[b.dataset.k];
  if(pick[side] === b) return;
  if(pick[side]) pick[side].classList.remove("open");          // on change d'avis : une seule carte ouverte par côté
  pick[side] = b; b.classList.add("open"); if(side === "fr") Lab.play(c.p);
  if(!pick.fr || !pick.es) return;
  moves++; const a = pick.fr, d = pick.es; pick = { fr: null, es: null };
  if(a.dataset.i === d.dataset.i){
    setTimeout(() => { a.classList.add("done"); d.classList.add("done"); a.classList.remove("open"); d.classList.remove("open"); }, 350);
    found++; info();
    if(found === total) setTimeout(() => { $("board").innerHTML = `<div class="card end"><img src="/img/ui/evo.png" alt=""><h2>¡Muy bien!</h2><p class="muted">${total} parejas en ${moves} intentos.</p><button class="btn" onclick="start()">Otra partida</button></div>`; }, 900);
  } else {
    lock = true; info();
    setTimeout(() => { a.classList.add("bad"); d.classList.add("bad"); }, 400);
    setTimeout(() => { a.classList.remove("open", "bad"); d.classList.remove("open", "bad"); lock = false; }, 1100);
  }
};
$("go").onclick = start;
Lab.load().then(() => { Lab.themeSelect($("theme"), v => { theme = v; start(); }); start(); });
</script>
</body>
</html>
